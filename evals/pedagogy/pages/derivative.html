<p id=def>Le nombre dérivé de f en a est f'(a) = lim<sub>h→0</sub> (f(a+h) − f(a)) / h.</p><p>Il correspond au coefficient directeur de la tangente à la courbe au point d'abscisse a.</p></div></body></html>
